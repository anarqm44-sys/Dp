{% extends "base.html" %}

{% block title %}تسجيل الدخول - سهلتهالك بكالوريا{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-brand-50 border border-brand-200 text-brand-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-sm">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900">تسجيل الدخول إلى حسابك</h2>
            <p class="text-xs text-slate-500">أدخل رقم الهاتف وكلمة المرور لمتابعة دروسك واختباراتك</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label for="phone" class="block text-xs font-bold text-slate-700 mb-1.5">رقم الهاتف (المسجل)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-phone text-xs"></i>
                    </span>
                    <input type="text" id="phone" name="phone" required placeholder="010XXXXXXXX"
                           class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-semibold outline-none transition text-left dir-ltr">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-semibold outline-none transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-500/25 transition">
                <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i> دخول
            </button>
        </form>

        <!-- Quick Demo Login Helpers -->
        <div class="pt-4 border-t border-slate-100">
            <span class="block text-xs font-bold text-slate-400 text-center mb-2.5">حسابات تجريبية سريعة للتجربة:</span>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="fillCredentials('01000000000', 'admin123')" class="p-2 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 text-xs font-bold transition text-center">
                    <i class="fa-solid fa-shield-halved ml-1"></i> حساب المدير
                </button>
                <button type="button" onclick="fillCredentials('01111111111', 'student123')" class="p-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold transition text-center">
                    <i class="fa-solid fa-user-graduate ml-1"></i> حساب الطالب
                </button>
            </div>
        </div>

        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-600 font-medium">
                ليس لديك حساب؟ 
                <a href="{{ url_for('register') }}" class="text-brand-600 font-bold hover:underline">أنشئ حساباً جديداً الآن</a>
            </p>
        </div>

    </div>
</div>

<script>
function fillCredentials(phone, password) {
    document.getElementById('phone').value = phone;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
